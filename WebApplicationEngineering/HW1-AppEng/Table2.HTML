<!DOCTYPE html>

<html>

<head>

    <title> Table 2 </title>

    <style>
        table, th, td{
            border: 2px solid rgb(200, 19, 206);
            padding: 20px;
        }


    </style>



</head>



<body>

    <h4> Hellow </h4>


    <table cellspacing = "20">
        <thead>
            <tr>
                <th>Column 1</th>
                <th> Column 2 </th>
                <th> Column 3 </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2"> Row 1 Cell 1 </td>
                <td> Row 1 Cell 2</td>
                <td> Row 1 Cell 3</td>
            </tr>
            <tr>
                <td> Row 2 Cell 2</td>
                <td> Row 2 Cell 3</td>
            </tr>
            <tr>
                <td colspan="3">Row 3 Cell 1</td>
            </tr>
        </tbody>
    </table>







</body>

</html>
